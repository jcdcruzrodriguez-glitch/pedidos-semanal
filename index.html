<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<title>Pedidos Irish Tavern</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--bg4:#22222e;--border:#2a2a38;--border2:#363648;--text:#f0f0f8;--text2:#9090a8;--text3:#5a5a72;--radius:12px;--font-head:'Barlow Condensed',sans-serif;--font-body:'Barlow',sans-serif;--nav-h:60px;--top-h:108px;--active-color:#3B82F6;--active-dim:rgba(59,130,246,0.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body)}
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,10px) 14px 0}
.top-row1{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px}
.app-title{font-family:var(--font-head);font-size:22px;font-weight:800;letter-spacing:-.5px}
.app-title span{color:var(--active-color)}
.week-badge{font-family:var(--font-head);font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--text3);background:var(--bg3);border:1px solid var(--border);padding:3px 9px;border-radius:20px}
.week-badge.monday{color:#ef4444;border-color:#ef4444;background:rgba(239,68,68,.1)}
.top-row2{display:flex;gap:8px;align-items:center;padding-bottom:9px}
#search{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-family:var(--font-body);font-size:15px;color:var(--text);outline:none}
#search::placeholder{color:var(--text3)}
.btn-summary{position:relative;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:7px 13px;font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap}
.btn-summary.has-items{color:var(--active-color);border-color:var(--active-color)}
.btn-summary .badge{position:absolute;top:-6px;right:-6px;background:var(--active-color);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:18px;text-align:center}
#scroll-area{position:fixed;top:var(--top-h);left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 14px}
.cat-header{display:flex;align-items:center;gap:8px;padding:12px 14px 5px;position:sticky;top:0;z-index:10;background:var(--bg)}
.cat-label{font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
.cat-line{flex:1;height:1px;background:var(--border)}
.cat-count{font-family:var(--font-head);font-size:11px;font-weight:600;color:var(--active-color);background:var(--bg3);border:1px solid var(--active-color);padding:1px 6px;border-radius:10px}
.prod-row{display:flex;align-items:center;gap:9px;padding:7px 14px;border-bottom:1px solid var(--border)}
.prod-row.has-qty{background:var(--active-dim)}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-row.has-qty .prod-name{color:var(--active-color);font-weight:600}
.prod-freq{font-size:10px;color:var(--text3);margin-top:1px;font-family:var(--font-head)}
.qty-controls{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-shrink:0}
.qty-btn{width:36px;height:36px;border:none;background:transparent;color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-btn:active{background:var(--border)}
.qty-val{width:36px;text-align:center;font-family:var(--font-head);font-size:17px;font-weight:700;color:var(--text);background:transparent;border:none;outline:none;-moz-appearance:textfield}
.qty-val::-webkit-outer-spin-button,.qty-val::-webkit-inner-spin-button{-webkit-appearance:none}
.qty-val.active{color:var(--active-color)}
.qty-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
#bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg2);border-top:1px solid var(--border);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);scrollbar-width:none}
#bottomnav::-webkit-scrollbar{display:none}
.nav-btn{flex:0 0 auto;min-width:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:transparent;padding:6px 8px}
.nav-icon{width:24px;height:3px;border-radius:2px;background:var(--text3)}
.nav-btn.active .nav-icon{height:4px;background:var(--nav-color)}
.nav-label{font-family:var(--font-head);font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--text3);white-space:nowrap}
.nav-btn.active .nav-label{color:var(--nav-color)}
.nav-dot{width:4px;height:4px;border-radius:50%;background:transparent}
.nav-btn.has-order .nav-dot{background:var(--nav-color,var(--text3))}
#summary-panel{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
#summary-panel.open{display:flex}
.summary-sheet{width:100%;max-height:88vh;background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--border);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,16px);animation:slideup .22s ease-out}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.summary-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:11px auto 0}
.summary-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px 9px;border-bottom:1px solid var(--border)}
.summary-title{font-family:var(--font-head);font-size:20px;font-weight:800}
.summary-close{width:30px;height:30px;border-radius:50%;background:var(--bg3);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text2)}
.summary-body{flex:1;overflow-y:auto;padding:10px 18px}
.summary-prov-block{margin-bottom:18px}
.summary-prov-name{font-family:var(--font-head);font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:6px;display:inline-block;margin-bottom:7px}
.summary-item{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.summary-item:last-child{border-bottom:none}
.summary-item-name{color:var(--text);flex:1;padding-right:10px}
.summary-item-qty{font-family:var(--font-head);font-size:17px;font-weight:700;min-width:24px;text-align:right}
.summary-empty{text-align:center;padding:40px 20px;font-family:var(--font-head);font-size:17px;color:var(--text3);letter-spacing:1px}
.summary-footer{display:flex;gap:9px;padding:11px 18px 4px;border-top:1px solid var(--border)}
.btn-action{flex:1;padding:13px;border-radius:11px;border:none;cursor:pointer;font-family:var(--font-head);font-size:15px;font-weight:700;letter-spacing:.5px}
.btn-reset{background:var(--bg3);color:#ef4444;border:1px solid #ef4444}
.btn-copy{background:var(--active-color);color:#fff}
#reset-banner{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);left:14px;right:14px;z-index:150;background:rgba(239,68,68,.12);border:1px solid #ef4444;border-radius:11px;padding:11px 14px;display:none;align-items:center;justify-content:space-between;gap:10px}
#reset-banner.show{display:flex}
.reset-msg{font-size:12px;color:#ef4444;font-weight:500}
.btn-reset-now{background:#ef4444;color:#fff;border:none;border-radius:7px;padding:5px 12px;font-family:var(--font-head);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-dismiss{background:transparent;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0 3px}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg4);border:1px solid var(--border2);padding:12px 26px;border-radius:13px;font-family:var(--font-head);font-size:17px;font-weight:700;color:var(--text);z-index:300;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="topbar">
  <div class="top-row1">
    <div class="app-title">IRISH TAVERN <span id="prov-label">TARDIO</span></div>
    <div class="week-badge" id="week-badge">SEM 0</div>
  </div>
  <div class="top-row2">
    <input type="search" id="search" placeholder="Buscar producto..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn-summary" id="btn-summary" onclick="openSummary()">
      PEDIDO<span class="badge" id="summary-badge" style="display:none">0</span>
    </button>
  </div>
</div>
<div id="scroll-area"></div>
<div id="bottomnav"></div>
<div id="summary-panel" onclick="closeSummaryIfBg(event)">
  <div class="summary-sheet">
    <div class="summary-handle"></div>
    <div class="summary-head">
      <div class="summary-title">PEDIDO SEM <span id="sum-week">0</span></div>
      <button class="summary-close" onclick="closeSummary()">✕</button>
    </div>
    <div class="summary-body" id="summary-body"></div>
    <div class="summary-footer">
      <button class="btn-action btn-reset" onclick="confirmReset()">RESETEAR TODO</button>
      <button class="btn-action btn-copy" id="btn-copy" onclick="copyOrder()">COPIAR PEDIDO</button>
    </div>
  </div>
</div>
<div id="reset-banner">
  <div class="reset-msg">🗓 Lunes — ¿resetear pedidos anteriores?</div>
  <button class="btn-reset-now" onclick="doReset()">RESETEAR</button>
  <button class="btn-dismiss" onclick="dismissBanner()">✕</button>
</div>
<div id="toast">¡Copiado!</div>

const PROVS = Object.keys(DATA);
let currentProv = PROVS[0];
let quantities = {};

function key(prov, name){ return prov+'||'+name; }
function getQty(prov, name){ return quantities[key(prov,name)]||0; }
function setQty(prov, name, val){
  val = Math.max(0,parseInt(val)||0);
  if(val===0) delete quantities[key(prov,name)];
  else quantities[key(prov,name)]=val;
  updateNav(); updateSummaryBadge();
}
function getWeekNumber(){ const d=new Date(),o=new Date(d.getFullYear(),0,1); return Math.ceil((((d-o)/86400000)+o.getDay()+1)/7); }
function isMonday(){ return new Date().getDay()===1; }

function buildNav(){
  const nav=document.getElementById('bottomnav');
  nav.innerHTML=PROVS.map(p=>`<button class="nav-btn${p===currentProv?' active':''}" data-prov="${p}" onclick="switchProv('${p}')" style="--nav-color:${DATA[p].color}"><div class="nav-icon"></div><div class="nav-label">${p.length>8?p.substring(0,8)+'…':p}</div><div class="nav-dot"></div></button>`).join('');
}

function switchProv(prov){
  currentProv=prov;
  document.getElementById('prov-label').textContent=prov;
  document.getElementById('prov-label').style.color=DATA[prov].color;
  document.documentElement.style.setProperty('--active-color',DATA[prov].color);
  document.documentElement.style.setProperty('--active-dim',hexToRgba(DATA[prov].color,0.12));
  document.getElementById('search').value='';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.prov===prov));
  renderList();
  document.getElementById('scroll-area').scrollTop=0;
}

function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function renderList(filter){
  const q=(filter||document.getElementById('search').value||'').toLowerCase().trim();
  const prov=DATA[currentProv];
  const color=DATA[currentProv].color;
  let html='';
  Object.entries(prov.cats).forEach(([cat,items])=>{
    const filtered=q?items.filter(p=>p.name.toLowerCase().includes(q)):items;
    if(!filtered.length) return;
    const withQty=filtered.filter(p=>getQty(currentProv,p.name)>0);
    html+=`<div class="cat-header"><div class="cat-label">${cat}</div><div class="cat-line"></div>${withQty.length?`<div class="cat-count">${withQty.length}</div>`:''}</div>`;
    filtered.forEach(p=>{
      const qty=getQty(currentProv,p.name);
      const hasQty=qty>0;
      const esc=p.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html+=`<div class="prod-row ${hasQty?'has-qty':''}">
        <div class="prod-info">
          <div class="prod-name">${p.name}</div>
          <div class="prod-freq">${p.freq} pedidos</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="adj('${currentProv}','${esc}',-1)">−</button>
          <div class="qty-sep"></div>
          <input class="qty-val ${hasQty?'active':''}" type="number" min="0" value="${qty||''}" placeholder="0"
            onchange="setQtyR('${currentProv}','${esc}',this.value)"
            onfocus="this.select()">
          <div class="qty-sep"></div>
          <button class="qty-btn" onclick="adj('${currentProv}','${esc}',1)">+</button>
        </div>
      </div>`;
    });
  });
  if(!html) html=`<div style="text-align:center;padding:50px 20px;color:var(--text3);font-family:var(--font-head);font-size:16px;letter-spacing:1px">SIN RESULTADOS</div>`;
  document.getElementById('scroll-area').innerHTML=html;
}

function adj(prov,name,delta){ setQty(prov,name,Math.max(0,getQty(prov,name)+delta)); renderList(); }
function setQtyR(prov,name,val){ setQty(prov,name,val); renderList(); }

function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const p=b.dataset.prov;
    const has=Object.keys(quantities).some(k=>k.startsWith(p+'||'));
    b.classList.toggle('has-order',has);
  });
}

function updateSummaryBadge(){
  const total=Object.keys(quantities).length;
  const badge=document.getElementById('summary-badge');
  badge.textContent=total;
  badge.style.display=total>0?'block':'none';
  document.getElementById('btn-summary').classList.toggle('has-items',total>0);
}

function openSummary(){
  let html=''; let hasAny=false;
  PROVS.forEach(prov=>{
    const items=Object.entries(quantities).filter(([k])=>k.startsWith(prov+'||')).map(([k,v])=>({name:k.split('||')[1],qty:v}));
    if(!items.length) return;
    hasAny=true;
    const c=DATA[prov].color;
    html+=`<div class="summary-prov-block"><div class="summary-prov-name" style="color:${c};background:${hexToRgba(c,.15)}">${prov}</div>`;
    items.forEach(i=>{ html+=`<div class="summary-item"><span class="summary-item-name">${i.name}</span><span class="summary-item-qty" style="color:${c}">${i.qty}</span></div>`; });
    html+='</div>';
  });
  if(!hasAny) html='<div class="summary-empty">SIN PRODUCTOS<br>EN EL PEDIDO</div>';
  document.getElementById('summary-body').innerHTML=html;
  document.getElementById('sum-week').textContent=getWeekNumber();
  document.getElementById('btn-copy').style.background=DATA[currentProv].color;
  document.getElementById('summary-panel').classList.add('open');
}
function closeSummary(){ document.getElementById('summary-panel').classList.remove('open'); }
function closeSummaryIfBg(e){ if(e.target.id==='summary-panel') closeSummary(); }

function confirmReset(){ if(confirm('¿Resetear todos los pedidos?')) doReset(); }
function doReset(){ quantities={}; updateNav(); updateSummaryBadge(); renderList(); closeSummary(); dismissBanner(); showToast('¡Reseteado!'); }
function dismissBanner(){ document.getElementById('reset-banner').classList.remove('show'); }

function copyOrder(){
  let lines=[`PEDIDO SEMANA ${getWeekNumber()} — IRISH TAVERN\n`];
  let hasAny=false;
  PROVS.forEach(prov=>{
    const items=Object.entries(quantities).filter(([k])=>k.startsWith(prov+'||')).map(([k,v])=>({name:k.split('||')[1],qty:v}));
    if(!items.length) return;
    hasAny=true;
    lines.push(`\n── ${prov} ──`);
    items.forEach(i=>lines.push(`  ${i.name}: ${i.qty}`));
  });
  if(!hasAny){ showToast('Sin productos'); return; }
  const text=lines.join('\n');
  if(navigator.share){ navigator.share({title:'Pedido Irish Tavern',text}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>showToast('¡Copiado!')); }
  else{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('¡Copiado!'); }
}

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));

// Init
const wk=getWeekNumber();
const wb=document.getElementById('week-badge');
wb.textContent=`SEM ${wk}`;
document.getElementById('sum-week').textContent=wk;
if(isMonday()){ wb.classList.add('monday'); wb.textContent=`LUNES · SEM ${wk}`; document.getElementById('reset-banner').classList.add('show'); }
document.getElementById('prov-label').style.color=DATA[PROVS[0]].color;
document.documentElement.style.setProperty('--active-color',DATA[PROVS[0]].color);
buildNav();
renderList();
</script>
