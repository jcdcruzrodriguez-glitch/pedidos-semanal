<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08110d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pedidos Irish">
  <title>Pedidos · Irish Tavern</title>
  <style>
    :root{color-scheme:dark;--bg:#07100c;--panel:#0d1913;--panel2:#122219;--line:#20352a;--text:#f4f7f5;--muted:#91a49a;--faint:#5f7569;--brand:#22c55e;--brand-soft:rgba(34,197,94,.13);--danger:#fb7185;--shadow:0 20px 55px rgba(0,0,0,.4)}
    *{box-sizing:border-box}
    html{background:var(--bg);scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -180px,#173a26 0,transparent 42%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
    button,input{font:inherit}
    button{color:inherit}
    .top{position:sticky;top:0;z-index:20;background:rgba(7,16,12,.93);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
    .title-row,.supplier-head,.order-top,.summary-head,.summary-actions{display:flex;align-items:center}
    .title-row{justify-content:space-between;gap:12px;margin-bottom:10px}
    .eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#6ee7a2;margin-bottom:2px}
    h1{font-size:21px;line-height:1.05;margin:0;letter-spacing:-.02em}
    .week{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;color:var(--muted)}
    .search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
    .search-wrap{position:relative}
    .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
    #search{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);outline:none;padding:0 38px 0 36px;font-size:16px}
    #search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
    .clear-search{display:none;position:absolute;right:5px;top:5px;width:34px;height:34px;border:0;background:transparent;color:var(--muted);font-size:18px}
    .clear-search.show{display:block}
    .scope-btn{height:44px;min-width:61px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:12px;font-weight:800;color:var(--muted);padding:0 10px}
    .scope-btn.active{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
    .supplier-nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 14px 2px;scroll-padding:14px}
    .supplier-nav::-webkit-scrollbar{display:none}
    .supplier-tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;position:relative}
    .supplier-tab.active{color:var(--supplier);border-color:var(--supplier);background:color-mix(in srgb,var(--supplier) 13%,var(--panel))}
    .supplier-tab.has-items::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--supplier)}
    main{max-width:760px;margin:0 auto;padding:12px 14px 24px}
    .supplier-head{justify-content:space-between;gap:12px;margin:8px 2px 12px}
    .supplier-name{font-size:23px;font-weight:900;letter-spacing:-.025em;margin:0}
    .supplier-meta{color:var(--muted);font-size:12px;margin-top:3px}
    .only-selected{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
    .only-selected.active{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
    .global-label{margin:18px 1px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;color:var(--supplier)}
    .category{margin-bottom:16px;border:1px solid var(--line);border-radius:16px;background:rgba(13,25,19,.75);overflow:hidden}
    .category-title{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(18,34,25,.74)}
    .category-title h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
    .category-count{font-size:10px;font-weight:800;color:var(--faint)}
    .product{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:61px;padding:8px 9px 8px 12px;border-bottom:1px solid rgba(32,53,42,.72)}
    .product:last-child{border-bottom:0}
    .product.selected{background:var(--brand-soft)}
    .product-name{font-size:13.5px;line-height:1.25;font-weight:650;overflow-wrap:anywhere}
    .product.selected .product-name{color:var(--brand)}
    .product-note{font-size:10px;color:var(--faint);margin-top:3px}
    .controls{display:grid;grid-template-columns:38px 42px 38px;height:40px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg)}
    .qty-btn{border:0;background:transparent;font-size:21px;color:var(--muted);padding:0;touch-action:manipulation}
    .qty-btn:active{background:var(--line)}
    .qty{width:42px;border:0;border-inline:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;font-weight:850;text-align:center;outline:none;-moz-appearance:textfield;padding:0}
    .qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .selected .qty{color:var(--brand)}
    .custom-actions{display:flex;gap:8px;margin:8px 1px 18px}
    .ghost-btn{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:11px 13px;font-size:12px;font-weight:800}
    .empty{border:1px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--text);margin-bottom:5px}
    .order-bar{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:736px;margin:auto;border:1px solid #2d5c40;border-radius:16px;background:rgba(15,35,23,.96);box-shadow:var(--shadow);padding:10px 11px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px)}
    .order-info{min-width:0;flex:1}
    .order-info strong{display:block;font-size:14px}
    .order-info span{display:block;color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .open-order{border:0;border-radius:11px;background:#22c55e;color:#041108;padding:11px 14px;font-size:12px;font-weight:900;white-space:nowrap}
    dialog{width:100%;max-width:760px;max-height:min(88vh,850px);margin:auto 0 0;border:1px solid var(--line);border-radius:22px 22px 0 0;background:var(--panel);color:var(--text);padding:0;box-shadow:var(--shadow)}
    dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
    .summary{display:flex;flex-direction:column;max-height:min(88vh,850px)}
    .handle{width:38px;height:4px;background:#3b5045;border-radius:4px;margin:9px auto 2px}
    .summary-head{justify-content:space-between;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
    .summary-head h2{font-size:20px;margin:0}
    .close{width:36px;height:36px;border:0;border-radius:50%;background:var(--panel2);font-size:18px;color:var(--muted)}
    .summary-body{overflow-y:auto;padding:13px 16px 6px}
    .order-supplier{margin-bottom:18px}
    .order-top{justify-content:space-between;gap:10px;margin-bottom:5px}
    .order-top h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--supplier);margin:0}
    .order-top span{font-size:10px;color:var(--faint)}
    .order-top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
    .supplier-share{border:1px solid color-mix(in srgb,var(--supplier) 55%,var(--line));border-radius:8px;background:color-mix(in srgb,var(--supplier) 12%,var(--panel2));color:var(--supplier);padding:6px 8px;font-size:10px;font-weight:900;letter-spacing:.03em}
    .order-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.25}
    .order-line b{color:var(--supplier);font-size:16px}
    .summary-empty{text-align:center;color:var(--muted);padding:42px 15px}
    .summary-actions{gap:8px;padding:11px 16px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
    .action{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:900}
    .action.primary{background:#22c55e;color:#041108;border-color:#22c55e}
    .action.danger{color:var(--danger);border-color:rgba(251,113,133,.45);flex:0 0 auto;padding-inline:12px}
    .toast{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-45%);padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:#172a20;box-shadow:var(--shadow);font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.18s}
    .toast.show{opacity:1;transform:translate(-50%,-50%)}
    @media(min-width:760px){dialog{margin:auto;border-radius:22px}.top{padding-inline:calc((100vw - 732px)/2)}.supplier-nav{max-width:760px;margin:auto}.order-bar{left:50%;right:auto;width:736px;transform:translateX(-50%)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>

  <header class="top">
    <div class="title-row">
      <div><div class="eyebrow">The Irish Tavern</div><h1>Pedido semanal</h1></div>
      <div class="week" id="week"></div>
    </div>
    <div class="search-row">
      <div class="search-wrap">

        <button class="action" id="copyOrder" type="button">COPIAR</button>
        <button class="action primary" id="shareOrder" type="button">COMPARTIR</button>
      </div>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  const STORAGE_KEY = 'irish-tavern-pedidos-v4';
  const suppliers = Object.keys(CATALOG);
  let currentSupplier = suppliers[0];
  let searchAll = false;
  let onlySelected = false;
  let state = loadState();

  const $ = selector => document.querySelector(selector);
  const normalize = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const escapeHTML = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const productId = (supplier,name) => encodeURIComponent(`${supplier}|${name}`);

  function loadState(){
    try{
      const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(saved && saved.quantities && saved.custom) return saved;
    }catch(e){}
    return {quantities:{},custom:{},updatedAt:null};
  }
  function saveState(){ state.updatedAt=new Date().toISOString(); localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
  function qty(supplier,name){ return Number(state.quantities[productId(supplier,name)]||0); }
  function setQty(supplier,name,value){
    const id=productId(supplier,name), clean=Math.max(0,Math.min(999,Number.parseInt(value,10)||0));
    if(clean) state.quantities[id]=clean; else delete state.quantities[id];
    saveState(); render();
  }
  function allProducts(supplier){
    const base=[];
    Object.entries(CATALOG[supplier].categories).forEach(([category,products])=>products.forEach(p=>base.push({...p,category,custom:false})));
    (state.custom[supplier]||[]).forEach(name=>base.push({name,uses:0,category:'Añadidos manualmente',custom:true}));
    return base;
  }
  function stats(){
    let lines=0,units=0;
    suppliers.forEach(s=>allProducts(s).forEach(p=>{const q=qty(s,p.name);if(q){lines++;units+=q;}}));
    return {lines,units};
  }
  function isoWeek(){
    const date=new Date(), target=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
    const day=target.getUTCDay()||7; target.setUTCDate(target.getUTCDate()+4-day);
    const start=new Date(Date.UTC(target.getUTCFullYear(),0,1));
    return Math.ceil((((target-start)/86400000)+1)/7);
  }

  function renderNav(){
    $('#supplierNav').innerHTML=suppliers.map(s=>{
      const has=allProducts(s).some(p=>qty(s,p.name));
      return `<button type="button" class="supplier-tab ${s===currentSupplier?'active':''} ${has?'has-items':''}" style="--supplier:${CATALOG[s].color}" data-supplier="${escapeHTML(s)}">${escapeHTML(s)}</button>`;
    }).join('');
  }
  function groupedMatches(supplier,query){
    const groups=new Map();
    allProducts(supplier).forEach(product=>{
      if(query && !normalize(product.name).includes(query)) return;
      if(onlySelected && !qty(supplier,product.name)) return;
      if(!groups.has(product.category)) groups.set(product.category,[]);
      groups.get(product.category).push(product);
    });
    return groups;
  }
  function renderProduct(supplier,product){
    const q=qty(supplier,product.name), id=productId(supplier,product.name);
    return `<div class="product ${q?'selected':''}" data-supplier="${escapeHTML(supplier)}" data-name="${escapeHTML(product.name)}">
      <div><div class="product-name">${escapeHTML(product.name)}</div><div class="product-note">${product.custom?'Añadido manualmente':product.uses>1?`Aparece en ${product.uses} líneas de factura`:'Referencia de factura'}${product.custom?' · toca para eliminar':''}</div></div>
      <div class="controls"><button class="qty-btn minus" type="button" aria-label="Quitar ${escapeHTML(product.name)}">−</button><input class="qty" id="q-${id}" inputmode="numeric" type="number" min="0" max="999" value="${q||''}" placeholder="0" aria-label="Cantidad de ${escapeHTML(product.name)}"><button class="qty-btn plus" type="button" aria-label="Añadir ${escapeHTML(product.name)}">+</button></div>
    </div>`;
  }
  function renderSupplier(supplier,query,global=false){
    const groups=groupedMatches(supplier,query);
    if(!groups.size) return '';
    const total=allProducts(supplier).length;
    let html=global?`<div class="global-label" style="--supplier:${CATALOG[supplier].color}">${escapeHTML(supplier)}</div>`:'';
    groups.forEach((products,category)=>{
      html+=`<section class="category" style="--brand:${CATALOG[supplier].color};--brand-soft:${CATALOG[supplier].color}20"><div class="category-title"><h2>${escapeHTML(category)}</h2><span class="category-count">${products.length}</span></div>${products.map(p=>renderProduct(supplier,p)).join('')}</section>`;
    });
    return html;
  }
  function renderCatalog(){
    const raw=$('#search').value.trim(), query=normalize(raw), color=CATALOG[currentSupplier].color;
    document.documentElement.style.setProperty('--brand',color);
    document.documentElement.style.setProperty('--brand-soft',`${color}20`);
    let content='';
    if(searchAll && query){
      content=suppliers.map(s=>renderSupplier(s,query,true)).join('');
      $('#catalog').innerHTML=`<div class="supplier-head"><div><h2 class="supplier-name">Resultados</h2><div class="supplier-meta">Buscando en los ${suppliers.length} proveedores</div></div></div>${content||emptyHTML('No hay coincidencias','Prueba con otra palabra.')}`;
    }else{
      const total=allProducts(currentSupplier).length, selected=allProducts(currentSupplier).filter(p=>qty(currentSupplier,p.name)).length;
      content=renderSupplier(currentSupplier,query,false);
      $('#catalog').innerHTML=`<div class="supplier-head"><div><h2 class="supplier-name" style="color:${color}">${escapeHTML(currentSupplier)}</h2><div class="supplier-meta">${total} productos · ${selected} seleccionados</div></div><button class="only-selected ${onlySelected?'active':''}" id="onlySelected" type="button">Solo pedido</button></div>${content||emptyHTML(onlySelected?'No hay productos seleccionados':'No hay coincidencias',onlySelected?'Añade cantidades para verlas aquí.':'Prueba con otra palabra.')}<div class="custom-actions"><button class="ghost-btn" id="addCustom" type="button">＋ Añadir producto manual</button></div>`;
    }
  }
  function emptyHTML(title,detail){ return `<div class="empty"><strong>${escapeHTML(title)}</strong>${escapeHTML(detail)}</div>`; }
  function renderOrderBar(){
    const {lines,units}=stats();
    $('#orderCount').textContent=lines?`${lines} producto${lines===1?'':'s'} · ${units} unidad${units===1?'':'es'}`:'Pedido vacío';
    $('#orderDetail').textContent=state.updatedAt&&lines?`Guardado ${new Date(state.updatedAt).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}`:'Los cambios se guardan en este teléfono';
  }
  function render(){ renderNav(); renderCatalog(); renderOrderBar(); $('#clearSearch').classList.toggle('show',!!$('#search').value); }

  function selectedBySupplier(){
    return suppliers.map(s=>({supplier:s,items:allProducts(s).map(p=>({name:p.name,qty:qty(s,p.name)})).filter(p=>p.qty)})).filter(g=>g.items.length);
  }
  function orderText(onlySupplier=null){
    const groups=selectedBySupplier().filter(group=>!onlySupplier||group.supplier===onlySupplier);
    if(!groups.length) return '';
    const lines=[`PEDIDO SEMANA ${isoWeek()} · THE IRISH TAVERN`,''];
    groups.forEach(group=>{lines.push(group.supplier.toUpperCase());group.items.forEach(item=>lines.push(`• ${item.qty} × ${item.name}`));lines.push('');});
    return lines.join('\n').trim();
  }
  function renderSummary(){
    const groups=selectedBySupplier();
    $('#summaryBody').innerHTML=groups.length?groups.map(group=>{
      const units=group.items.reduce((sum,item)=>sum+item.qty,0), color=CATALOG[group.supplier].color;
      return `<section class="order-supplier" style="--supplier:${color}"><div class="order-top"><h3>${escapeHTML(group.supplier)}</h3><div class="order-top-actions"><span>${units} uds.</span><button class="supplier-share" type="button" data-share-supplier="${escapeHTML(group.supplier)}" aria-label="Enviar pedido de ${escapeHTML(group.supplier)} por WhatsApp">WHATSAPP</button></div></div>${group.items.map(item=>`<div class="order-line"><span>${escapeHTML(item.name)}</span><b>${item.qty}</b></div>`).join('')}</section>`;
    }).join(''):'<div class="summary-empty">Todavía no has añadido productos.</div>';
  }
  function showToast(message){ const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),1500); }
  async function copyText(){
    const text=orderText(); if(!text){showToast('El pedido está vacío');return false;}
    try{await navigator.clipboard.writeText(text);}catch(e){const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove();}
    showToast('Pedido copiado'); return true;
  }

  $('#supplierNav').addEventListener('click',event=>{
    const button=event.target.closest('[data-supplier]');if(!button)return;
    currentSupplier=button.dataset.supplier;searchAll=false;onlySelected=false;$('#scopeBtn').classList.remove('active');$('#scopeBtn').setAttribute('aria-pressed','false');render();button.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});window.scrollTo({top:0,behavior:'smooth'});
  });
  $('#catalog').addEventListener('click',event=>{
    const row=event.target.closest('.product');
    if(row && (event.target.closest('.minus')||event.target.closest('.plus'))){const delta=event.target.closest('.plus')?1:-1;setQty(row.dataset.supplier,row.dataset.name,qty(row.dataset.supplier,row.dataset.name)+delta);return;}
    if(event.target.closest('#onlySelected')){onlySelected=!onlySelected;render();return;}
    if(event.target.closest('#addCustom')){const name=prompt(`Nuevo producto para ${currentSupplier}:`);if(!name||!name.trim())return;const clean=name.trim().toUpperCase();state.custom[currentSupplier]=state.custom[currentSupplier]||[];if(!state.custom[currentSupplier].some(x=>normalize(x)===normalize(clean)))state.custom[currentSupplier].push(clean);saveState();render();showToast('Producto añadido');return;}
    if(row && row.querySelector('.product-note').textContent.startsWith('Añadido') && event.target.closest('.product-name')){if(confirm(`¿Eliminar “${row.dataset.name}”?`)){state.custom[row.dataset.supplier]=state.custom[row.dataset.supplier].filter(x=>x!==row.dataset.name);delete state.quantities[productId(row.dataset.supplier,row.dataset.name)];saveState();render();}}
  });
  $('#catalog').addEventListener('change',event=>{if(!event.target.matches('.qty'))return;const row=event.target.closest('.product');setQty(row.dataset.supplier,row.dataset.name,event.target.value);});
  $('#search').addEventListener('input',render);
  $('#clearSearch').addEventListener('click',()=>{$('#search').value='';$('#search').focus();render();});
  $('#scopeBtn').addEventListener('click',()=>{searchAll=!searchAll;$('#scopeBtn').classList.toggle('active',searchAll);$('#scopeBtn').setAttribute('aria-pressed',String(searchAll));render();});
  $('#openOrder').addEventListener('click',()=>{renderSummary();$('#orderDialog').showModal();});
  $('#summaryBody').addEventListener('click',event=>{const button=event.target.closest('[data-share-supplier]');if(!button)return;const text=orderText(button.dataset.shareSupplier);if(!text){showToast('Ese proveedor no tiene productos');return;}window.location.href=`https://wa.me/?text=${encodeURIComponent(text)}`;});
  $('#closeOrder').addEventListener('click',()=>$('#orderDialog').close());
  $('#orderDialog').addEventListener('click',event=>{if(event.target===$('#orderDialog'))$('#orderDialog').close();});
  $('#copyOrder').addEventListener('click',copyText);
  $('#shareOrder').addEventListener('click',async()=>{const text=orderText();if(!text){showToast('El pedido está vacío');return;}if(navigator.share){try{await navigator.share({title:`Pedido semana ${isoWeek()} · Irish Tavern`,text});}catch(e){if(e.name!=='AbortError')await copyText();}}else await copyText();});
  $('#resetOrder').addEventListener('click',()=>{if(!stats().lines||!confirm('¿Borrar todas las cantidades del pedido?'))return;state.quantities={};saveState();renderSummary();render();showToast('Pedido borrado');});
  $('#week').textContent=`SEMANA ${isoWeek()}`;
  render();
  </script>
</body>
</html>
